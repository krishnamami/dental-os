<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accord Dental — The Dental Decision Intelligence Platform</title>
    <meta name="description" content="Evidence assembled. Policy applied. Decisions explained. Pre-determination intelligence for dental practices and DSOs — every signal traceable to an ADA guideline, a payer rule, or your own overlay." />
    <!-- Plus Jakarta Sans, matching accordlend. preconnect to both
         hosts because the CSS and the font files are served from
         different origins; without the gstatic hint the font request
         waits on a second DNS+TLS round trip. display=swap renders in
         the fallback immediately rather than holding text invisible. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
