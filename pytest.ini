[pytest]
testpaths = tests
asyncio_mode = auto

# One event loop for the whole session. The API suite opens asyncpg
# pools in a session-scoped fixture, and a pool is bound to the loop
# that created it — a per-test loop makes every request after the first
# raise "attached to a different loop".
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

filterwarnings =
    ignore::DeprecationWarning
